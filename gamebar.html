<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamebar</title>
<style>
  :root { --bg: #0d0f12; --panel: #16191f; --border: #2a2f38; --text: #e8eaed; --muted: #9aa2ad; --accent: #ffcc00; --live: #e33; }
  body.light { --bg: #f2f3f5; --panel: #ffffff; --border: #d5d9df; --text: #17191c; --muted: #5f6773; --accent: #a97e00; }
  body.transparent { --bg: transparent; --border: rgba(128,128,128,.25); }
  /* "Director" theme — Chargers bolt yellow + electric teal on black */
  body.director { --bg: #060709; --border: #14333f; --text: #f5f8fa; --muted: #86a3b3; --accent: #ffd400; --live: #ff4040; }
  body.director a.bar { border-top: 1.6vh solid #1fdbe8; border-bottom: 1.6vh solid #1fdbe8; }
  body.director .brandblock { display: flex; }
  .brandblock {
    display: none; align-items: center; align-self: stretch; padding: 0 3vh; margin-right: 1vh;
    background: linear-gradient(135deg, #ffd400 60%, #ffb300); color: #0a1a4d;
    font-weight: 900; font-size: 26vh; letter-spacing: .3vh; white-space: nowrap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden; white-space: nowrap;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a.bar { display: flex; align-items: center; height: 100%; text-decoration: none; color: inherit; gap: 2.5vh; padding: 0 3vh 0 0; }
  .side { display: inline-flex; align-items: center; gap: 6vh; flex: 0 0 auto; border-bottom: 2.5vh solid transparent; padding: 2vh 2vh 1vh; }
  .side img { height: 70vh; width: auto; filter: drop-shadow(0 0 3vh rgba(0,0,0,.6)); }
  .ab { font-weight: 900; font-size: 32vh; letter-spacing: .2vh; }
  .sc { font-weight: 900; font-size: 44vh; font-variant-numeric: tabular-nums; }
  .loser .ab, .loser .sc { color: var(--muted); }
  .poss { font-size: 20vh; }
  .mid { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0 2vh; line-height: 1.15; }
  .mid .clk { font-weight: 800; font-size: 24vh; font-variant-numeric: tabular-nums; }
  .mid .lv { font-size: 14vh; font-weight: 800; color: var(--live); letter-spacing: .3vh; }
  .mid .lv .dot { display: inline-block; width: 7vh; height: 7vh; border-radius: 50%; background: var(--live); margin-right: 1vh; animation: pulse 1.4s infinite; vertical-align: middle; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .info { flex: 1 1 auto; min-width: 0; overflow: hidden; border-left: 1px solid var(--border); padding-left: 2.5vh; }
  .dd { font-weight: 800; font-size: 22vh; }
  .dd .at { color: var(--muted); font-weight: 600; }
  .lp { color: var(--muted); font-size: 18vh; margin-top: 2vh; overflow: hidden; text-overflow: ellipsis; }
  .lp b { color: var(--text); }
</style>
</head>
<body>
<a class="bar" id="bar" href="#" target="_top">
  <span class="brandblock" id="brandBlock">⚡</span>
  <span class="side" id="awaySide"><img alt="" src=""><span class="ab"></span><span class="sc"></span><span class="poss"></span></span>
  <span class="mid" style="padding: 0 4vh;"><span class="lv" id="liveTag"></span><span class="clk" id="clk">&hellip;</span></span>
  <span class="side" id="homeSide"><span class="poss"></span><span class="sc"></span><span class="ab"></span><img alt="" src=""></span>
  <span class="info"><span class="dd" id="dd"></span><div class="lp" id="lp"></div></span>
</a>

<script>
(function () {
  "use strict";
  var API = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";
  var qs = new URLSearchParams(location.search);
  var eventId = qs.get("event") || "401873285";
  var sbDate = qs.get("date") || null;
  var theme = qs.get("theme");
  if (theme === "light") document.body.classList.add("light");
  if (theme === "director") document.body.classList.add("director");
  if (qs.get("bg") === "transparent") document.body.classList.add("transparent");
  if (qs.get("brand")) { var bb = document.getElementById("brandBlock"); bb.textContent = qs.get("brand"); bb.style.display = "flex"; }
  var timer = null;

  document.getElementById("bar").href = "gamecast.html?event=" + encodeURIComponent(eventId);

  function get(obj, path, dflt) {
    try { var cur = obj; for (var i = 0; i < path.length; i++) { if (cur == null) return dflt; cur = cur[path[i]]; } return cur == null ? dflt : cur; }
    catch (e) { return dflt; }
  }
  function sbDateFromISO(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return null;
    d = new Date(d.getTime() - 6 * 3600 * 1000);
    return d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, "0") + String(d.getUTCDate()).padStart(2, "0");
  }
  function fetchJSON(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function side(el, c, myScore, otherScore, over, hasBall, state) {
    var t = c.team || {};
    el.style.borderBottomColor = t.color ? "#" + t.color : "transparent";
    el.querySelector("img").src = t.logo || get(t, ["logos", 0, "href"], "");
    el.querySelector(".ab").textContent = t.abbreviation || "";
    el.querySelector(".sc").textContent = state === "pre" ? "" : (c.score != null ? c.score : "");
    el.querySelector(".poss").textContent = hasBall ? "🏈" : "";
    el.classList.toggle("loser", over && !isNaN(myScore) && !isNaN(otherScore) && myScore < otherScore);
  }

  function refresh() {
    fetchJSON(API + "/summary?event=" + encodeURIComponent(eventId)).then(function (summary) {
      var date = sbDate || sbDateFromISO(get(summary, ["header", "competitions", 0, "date"], null));
      return fetchJSON(API + "/scoreboard" + (date ? "?dates=" + date : "")).catch(function () { return null; }).then(function (sb) {
        return [summary, sb];
      });
    }).then(function (res) {
      var summary = res[0], sb = res[1];
      var comp = get(summary, ["header", "competitions", 0], {});
      var comps = comp.competitors || [];
      var away = comps.find(function (c) { return c.homeAway === "away"; }) || comps[1] || {};
      var home = comps.find(function (c) { return c.homeAway === "home"; }) || comps[0] || {};
      var status = comp.status || {};
      var state = get(status, ["type", "state"], "pre");
      var over = state === "post";
      var aS = parseInt(away.score, 10), hS = parseInt(home.score, 10);

      var sit = null;
      if (sb) {
        var ev = (sb.events || []).find(function (e) { return String(e.id) === String(eventId); });
        sit = get(ev, ["competitions", 0, "situation"], null);
      }
      var possId = sit ? sit.possession : null;

      side(document.getElementById("awaySide"), away, aS, hS, over, state === "in" && possId != null && String(possId) === String(get(away, ["team", "id"])), state);
      side(document.getElementById("homeSide"), home, hS, aS, over, state === "in" && possId != null && String(possId) === String(get(home, ["team", "id"])), state);

      var clk = document.getElementById("clk"), lv = document.getElementById("liveTag");
      if (state === "in") {
        lv.innerHTML = "<span class='dot'></span>LIVE";
        clk.textContent = (status.displayClock || "") + " · Q" + (status.period || "");
      } else if (over) {
        lv.textContent = "";
        clk.textContent = /OT/.test(get(status, ["type", "shortDetail"], "")) ? get(status, ["type", "shortDetail"], "FINAL") : "FINAL";
      } else {
        lv.textContent = "";
        clk.textContent = get(status, ["type", "shortDetail"], "PREGAME");
      }

      var dd = document.getElementById("dd"), lp = document.getElementById("lp");
      var ddText = sit ? (sit.shortDownDistanceText || sit.downDistanceText || "") : "";
      var posText = sit ? (sit.possessionText || "") : "";
      var lastPlay = get(sit, ["lastPlay", "text"], "");
      if (!lastPlay) {
        var cur = get(summary, ["drives", "current", "plays"], []);
        if (cur.length) lastPlay = cur[cur.length - 1].text || "";
      }
      dd.innerHTML = ddText ? ddText + (posText ? " <span class='at'>at " + posText + "</span>" : "") : "";
      dd.style.display = state === "in" && ddText ? "" : "none";
      lp.innerHTML = lastPlay && !over ? "<b>Last:</b> " + lastPlay.replace(/[<>]/g, "") : "";
      document.title = (get(away, ["team", "abbreviation"], "") || "?") + " " + (isNaN(aS) ? "" : aS) + "–" + (isNaN(hS) ? "" : hS) + " " + (get(home, ["team", "abbreviation"], "") || "?");

      schedule(state === "in" ? 15000 : over ? 0 : 60000);
    }).catch(function () {
      document.getElementById("clk").textContent = "offline";
      schedule(30000);
    });
  }
  function schedule(ms) { clearTimeout(timer); if (ms) timer = setTimeout(refresh, ms); }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) clearTimeout(timer); else refresh();
  });
  refresh();
})();
</script>
</body>
</html>
